
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starvix-agent-runtime"
version = "0.1.0"
description = "Starvix — a local-first LangGraph agent runtime"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "langgraph",
    "langchain",
    "langchain-core",
    "guardrails-ai",
    "typer",
    "rich",
    "pydantic",
    "PyYAML",
    "python-dotenv",
    "langchain-mcp-adapters",
    "langgraph-checkpoint-sqlite",
    "prompt_toolkit>=3.0.0",
    "pyperclip>=1.8.0",
    "langsmith",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "anyio",
]
providers = [
    "langchain-groq",
    "langchain-google-genai",
    "langchain-openrouter",
]

[project.scripts]
starvix = "agent_cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "integration: mark test as integration test requiring external provider or environment setup",
]
